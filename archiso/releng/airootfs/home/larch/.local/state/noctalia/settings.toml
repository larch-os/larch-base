config_version = 13

[backdrop]
enabled = true

[bar.default]
border = "primary"
border_width = 0.5
capsule = true
center = ["taskbar"]
end = [
    "install_larch",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "battery",
    "control-center",
]
margin_edge = 4
margin_ends = 350
start = ["clock", "cpu", "ram"]

[control_center]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget]

[dock]
auto_hide = true
layer = "overlay"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[osd]
position = "top_right"

[shell]
font_family = "Adwaita Sans"
screen_time_enabled = true

[shell.launcher]
pinned = ["firefox", "org.kde.dolphin", "kitty"]

[shell.panel]
open_near_click_control_center = true

[[shell.session.actions]]
action = "logout"
countdown_seconds = 5.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 5.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 5.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 5.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 5.0
enabled = true
shortcut = "5"
variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Doomed"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["kcolorscheme", "kitty"]

[wallpaper]
directory = "/home/larch/Pictures/Wallpapers"
transition_on_startup = true

[wallpaper.default]
path = "/home/larch/Pictures/Wallpapers/default.png"

[wallpaper.last]
path = "/home/larch/Pictures/Wallpapers/default.png"

[widget.clock]
format = "{:%-I:%M %p}"

[widget.install_larch]
type = "custom_button"
glyph = "device-desktop-down"
tooltip = "Install Larch"

# pkexec strips the environment before launching root processes, so
# without explicitly forwarding these, Qt can't detect Wayland and
# falls back to trying X11 (which doesn't exist here) and aborts --
# confirmed via journalctl: "could not connect to display", "Could
# not load the Qt platform plugin xcb". QT_QPA_PLATFORM=wayland
# forces the right platform outright rather than relying on
# detection. HOME=/home/larch (not root's own, which has no
# qt6ct.conf) so the installer actually picks up the dark theme
# instead of Qt's default light palette.
[widget.install_larch.actions]
left = "exec sh -c 'pkexec env WAYLAND_DISPLAY=$WAYLAND_DISPLAY XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR QT_QPA_PLATFORM=wayland QT_QPA_PLATFORMTHEME=qt6ct HOME=/home/larch calamares'"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.taskbar]
anchor = true
capsule = true
capsule_opacity = 0.0
capsule_radius = "auto"
group_by_workspace = true
inactive_opacity = 0.69999999999999996
minimal = true
show_all_outputs = true
workspace_label_placement = "inside"

[widget.workspaces]
show_all_outputs = true

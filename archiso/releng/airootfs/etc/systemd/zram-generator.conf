# zram-size and swap-priority/fs-type below already match
# zram-generator's own built-in defaults for a swap device -- kept
# explicit for clarity. compression-algorithm is the one deliberate
# deviation: unspecified falls back to the kernel's own zram default,
# zstd trades a bit of CPU for a meaningfully better ratio.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
